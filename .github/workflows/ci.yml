name: MLOps Pipeline

on:
  push:
    branches:
      - "feature/**"
      - develop

env:
  REGISTRY: ghcr.io
  # Nom en minuscules hardcodé pour Docker
  IMAGE_NAME: bigmatrix2/mini_projet_mlops/iris-prediction-api

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Entraînement (feature/* et develop)
  # ─────────────────────────────────────────
  train:
    name: Installer & Entraîner le modèle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Entraîner le modèle
        run: python train.py

      - name: Uploader le modèle
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: model.pkl
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2 : Build Docker (develop seulement)
  # ─────────────────────────────────────────
  build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Télécharger le modèle
        uses: actions/download-artifact@v4
        with:
          name: model-artifact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login sur GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Uploader l'image Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 3 : Push Docker (develop seulement)
  # ─────────────────────────────────────────
  push:
    name: Push image Docker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Login sur GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Charger et push l'image Docker
        run: |
          docker load --input /tmp/image.tar
          docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}